services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apartments-manager
    volumes:
      - ./data:/data
    ports:
      - "8081:5000"
    environment:
      - DATA_DIR=/data
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost: the server binds IPv4 only, and localhost
      # resolves to ::1 first inside the container.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
