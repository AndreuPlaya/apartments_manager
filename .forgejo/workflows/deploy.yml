# Despliegue de pms (Apartments Manager) a docker-host.
#
# Se dispara al empujar una etiqueta `v*`:
#
#     git tag v1.2.3 && git push origin v1.2.3
#
# Qué hace, en orden:
#   1. tests (etapa `tests` del Dockerfile)
#   2. construye la imagen y la publica en el registro de Forgejo
#   3. apunta el stack `ixa-apps` de Portainer a la versión nueva y lo redespliega
#   4. espera al healthcheck de `pms` y falla si no se pone sano
#
# El despliegue es SÍNCRONO: si el paso 4 falla lo sabes en el log, no el lunes.
# Para volver atrás, redespliega `ixa-apps` con PMS_VERSION en la etiqueta
# anterior — están todas en el registro.
#
# La imagen se etiqueta con la versión y NUNCA con :latest, que es lo que pide
# REC-2 y lo que necesita el relanzado de los domingos: `docker compose up -d`
# tiene que traer exactamente la versión que se probó.
#
# ── Por qué el job corre en `docker:28-cli` ──────────────────────────────────
# Esa imagen trae el cliente de Docker y git, y nada más. No lleva Node, y es a
# propósito: los tests corren dentro del build (`--target tests`), así que el
# job no necesita el toolchain de JavaScript. Por lo mismo el clonado se hace
# con git a pelo en vez de con `actions/checkout`, que es una acción JS y
# obligaría a meter Node en la imagen sólo para eso.
#
# Secretos del repositorio (Configuración → Actions → Secrets):
#   REGISTRY_USER        usuario de Forgejo con write:package
#   REGISTRY_TOKEN       su token de acceso
#   STACK_GIT_USER       usuario máquina que lee el repo del stack (docker-host)
#   STACK_GIT_TOKEN      su token de sólo lectura
#                        (no pueden llamarse FORGEJO_*: la forja reserva ese
#                         prefijo y rechaza el alta con «invalid secret name»)
#   PORTAINER_URL        p.ej. https://10.10.0.30:9443
#   PORTAINER_USER       usuario de Portainer
#   PORTAINER_PASSWORD   su contraseña

name: desplegar pms

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: 10.10.0.30:3000
  IMAGEN: 10.10.0.30:3000/rnukes/pms

jobs:
  desplegar:
    runs-on: docker-host
    steps:
      - name: Traer el código en la etiqueta
        run: |
          set -eu
          VERSION="${GITHUB_REF##refs/tags/}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          # El runner inyecta el token del job; basta para clonar este repo.
          git -c http.extraheader="Authorization: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" \
              fetch --depth 1 origin "refs/tags/$VERSION"
          git checkout -q FETCH_HEAD
          echo "desplegando $VERSION desde $(git rev-parse --short HEAD)"

      - name: Tests
        # Etapa `tests` del Dockerfile: falla el build si falla un test.
        run: docker build --target tests -t pms-tests:${VERSION} .

      - name: Construir la imagen
        # El techo de heap de V8 es lo que de verdad contiene el build: quien se
        # dispara es vite/tsup. Medido: 768 MB de pico sin este límite.
        run: |
          docker build \
            --build-arg NODE_OPTIONS=--max-old-space-size=768 \
            -t "$IMAGEN:$VERSION" .

      - name: Publicar en el registro de Forgejo
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USER }}" --password-stdin
          docker push "$IMAGEN:$VERSION"
          docker logout "$REGISTRY"

      - name: Redesplegar ixa-apps en Portainer
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_USER: ${{ secrets.PORTAINER_USER }}
          PORTAINER_PASSWORD: ${{ secrets.PORTAINER_PASSWORD }}
          # OJO: no sirve REGISTRY_TOKEN. Portainer vuelve a clonar el repo del
          # stack, y eso pide lectura de repositorio; el token del registro sólo
          # tiene `write:package`. Va el usuario máquina `docker-host`, que es
          # el que ya usa el relanzado de los domingos.
          FORGEJO_USER: ${{ secrets.STACK_GIT_USER }}
          FORGEJO_TOKEN: ${{ secrets.STACK_GIT_TOKEN }}
        run: |
          apk add --no-cache python3 >/dev/null
          python3 .forgejo/scripts/redesplegar.py ixa-apps "PMS_VERSION=$VERSION"

      - name: Esperar a que pms esté sano
        run: |
          for i in $(seq 1 60); do
            estado=$(docker inspect -f '{{.State.Health.Status}}' pms 2>/dev/null || echo ausente)
            case "$estado" in
              healthy)   echo "pms sano en el intento $i"; exit 0 ;;
              unhealthy) echo "pms arrancó ENFERMO"; docker logs --tail 50 pms; exit 1 ;;
            esac
            sleep 5
          done
          echo "pms no llegó a sano en 5 minutos"
          docker logs --tail 50 pms
          exit 1

      - name: Confirmar la versión desplegada
        run: |
          corriendo=$(docker inspect -f '{{.Config.Image}}' pms)
          echo "pms corre $corriendo"
          [ "$corriendo" = "$IMAGEN:$VERSION" ] || {
            echo "esperaba $IMAGEN:$VERSION"; exit 1; }

      - name: Limpiar
        if: always()
        run: docker image rm -f "pms-tests:${VERSION}" 2>/dev/null || true
